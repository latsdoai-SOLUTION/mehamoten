<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הדף לא נמצא — מהמותן</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/app/icons/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#14101d;color:#f4f0fb;font-family:'Heebo',system-ui,sans-serif;text-align:center;padding:24px}
h1{font-family:'Secular One',sans-serif;font-weight:400;font-size:clamp(2.4rem,8vw,4.5rem);margin:0 0 8px}
h1 span{color:#e23149}
p{color:#b3a9c9;font-size:1.15rem;max-width:460px;margin:0 auto 26px}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#c9203a,#e23149);color:#fff;text-decoration:none;font-weight:700;margin:6px}
.ghost{background:rgba(246,231,180,.08);border:1px solid rgba(246,231,180,.3);color:#f6e7b4}
</style>
</head>
<body>
<div>
  <h1>החלפה<span>!</span></h1>
  <p>הדף הזה ירד מהבמה. אבל המשחק ממשיך — בחרו לאן:</p>
  <a class="btn" href="/">לאתר מהמותן</a>
  <a class="btn ghost" href="/app/">לאפליקציה</a>
</div>
</body>
</html>
